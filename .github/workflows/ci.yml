# Runs the tests on every pull request and on pushes to main. It needs no secrets, so it is safe for forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      # Pinned to a commit, not a moving tag. This is actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Swift
        run: swift build && swift test

      - name: UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
